<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tsin — Hamouni Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F1;
    --ink:#1E1C19;
    --ink-soft:rgba(30,28,25,0.6);
    --line:rgba(30,28,25,0.12);
    --wine:#6E2430;
    --wine-soft:rgba(110,36,48,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:300;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;}

  /* Reveal-on-scroll */
  .reveal{opacity:0; transform:translateY(26px); transition:opacity 0.9s cubic-bezier(.16,.8,.3,1), transform 0.9s cubic-bezier(.16,.8,.3,1);}
  .reveal.visible{opacity:1; transform:translateY(0);}

  header{
    padding:30px 24px;
    text-align:center;
  }
  .brand{
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    letter-spacing:0.34em;
    text-transform:uppercase;
    color:var(--ink);
    font-weight:500;
  }

  .hero{
    text-align:center;
    padding:24px 24px 40px;
  }
  .hero .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--wine);
    margin-bottom:14px;
    font-weight:500;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:400;
    font-style:normal;
    font-size:clamp(52px,11vw,104px);
    margin:0;
    letter-spacing:0.01em;
  }

  /* Video — full-bleed, click-to-play */
  .video-section{padding:0 0 88px;}
  .video-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#000;
    cursor:pointer;
  }
  .video-frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  .video-poster{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform 1.2s cubic-bezier(.16,.8,.3,1), filter 0.6s ease;
  }
  .video-frame:hover .video-poster{transform:scale(1.02);}
  .video-shade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.32) 100%);
    transition:opacity 0.5s ease;
  }
  .play-btn{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:88px; height:88px;
    border-radius:50%;
    background:rgba(250,247,241,0.94);
    border:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform 0.35s cubic-bezier(.16,.8,.3,1), background 0.35s ease;
    box-shadow:0 10px 40px rgba(0,0,0,0.28);
  }
  .play-btn::after{
    content:'';
    position:absolute; inset:-14px;
    border-radius:50%;
    border:1px solid rgba(250,247,241,0.55);
    animation:pulse-ring 2.6s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{transform:scale(0.92); opacity:0.9;}
    80%{transform:scale(1.35); opacity:0;}
    100%{transform:scale(1.35); opacity:0;}
  }
  .video-frame:hover .play-btn{transform:translate(-50%,-50%) scale(1.08); background:#fff;}
  .play-btn svg{fill:var(--wine); margin-left:4px;}
  .video-frame.playing .play-btn,
  .video-frame.playing .video-shade,
  .video-frame.playing .video-poster{display:none;}

  section{
    padding:0 24px 90px;
  }
  .section-label{
    text-align:center;
    font-size:11px;
    letter-spacing:0.26em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 26px;
  }

  .gallery{
    max-width:1200px;
    margin:0 auto;
    column-count:4;
    column-gap:10px;
  }
  .gallery figure{
    margin:0 0 10px;
    break-inside:avoid;
    overflow:hidden;
    cursor:pointer;
    position:relative;
    background:var(--wine-soft);
  }
  .gallery img{
    width:100%;
    display:block;
    transition:transform 0.6s cubic-bezier(.16,.8,.3,1), opacity 0.5s ease;
    opacity:0;
  }
  .gallery img.loaded{opacity:1;}
  .gallery figure:hover img{transform:scale(1.035);}
  @media (max-width:980px){ .gallery{column-count:3;} }
  @media (max-width:640px){ .gallery{column-count:2; column-gap:7px;} .gallery figure{margin-bottom:7px;} }

  .download{text-align:center;}
  .download-btn{
    display:inline-block;
    padding:19px 52px;
    background:var(--wine);
    color:var(--bg);
    text-decoration:none;
    letter-spacing:0.16em;
    text-transform:uppercase;
    font-size:12.5px;
    font-weight:500;
    border-radius:2px;
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .download-btn:hover{opacity:0.85; transform:translateY(-2px);}
  .download-help{
    max-width:420px;
    margin:20px auto 0;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  footer{
    text-align:center;
    padding:44px 24px 60px;
    font-size:12px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  footer .studio{
    font-family:'Fraunces', serif;
    font-size:16px;
    color:var(--ink);
    margin-bottom:8px;
  }
  footer a{text-decoration:none;border-bottom:1px solid var(--line);}

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(30,28,25,0.97);
    display:none; align-items:center; justify-content:center;
    z-index:1000; padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:88vh; box-shadow:0 20px 60px rgba(0,0,0,0.5); opacity:0; transform:scale(0.98); transition:opacity 0.3s ease, transform 0.3s ease;}
  .lightbox img.shown{opacity:1; transform:scale(1);}
  .lightbox-close, .lightbox-prev, .lightbox-next{
    position:fixed; background:none; border:0; color:#FAF7F1; cursor:pointer;
    font-family:'Work Sans', sans-serif; font-size:15px; letter-spacing:0.05em;
    transition:opacity 0.25s ease; opacity:0.75;
  }
  .lightbox-close:hover, .lightbox-prev:hover, .lightbox-next:hover{opacity:1;}
  .lightbox-close{top:26px; right:32px; font-size:28px; line-height:1;}
  .lightbox-prev{left:24px; top:50%; transform:translateY(-50%); font-size:34px; padding:12px;}
  .lightbox-next{right:24px; top:50%; transform:translateY(-50%); font-size:34px; padding:12px;}
  .lightbox-count{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); color:rgba(250,247,241,0.7); font-size:12px; letter-spacing:0.1em;}
</style>
</head>
<body>

  <header class="reveal">
    <div class="brand">Hamouni Studio</div>
  </header>

  <div class="hero reveal">
    <div class="eyebrow">Event 2026</div>
    <h1>Tsin</h1>
  </div>

  <section class="video-section">
    <div class="video-frame reveal" id="videoFrame">
      <img class="video-poster" src="https://drive.google.com/thumbnail?id=1RxcbsyHkP-ZZUzZxFN0HdE-L4xnKQhac&sz=w1920" alt="">
      <div class="video-shade"></div>
      <button class="play-btn" id="playBtn" aria-label="Play the film">
        <svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </section>

  <section>
    <div class="section-label reveal">119 photos</div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="download">
    <a class="download-btn reveal" href="https://drive.google.com/drive/folders/1pc3XqV9hqrwUx7Gv6GR_XoecZ_hwU4BT?usp=sharing" target="_blank" rel="noopener">Download All</a>
    <p class="download-help reveal">Film and photos in full resolution, via Google Drive.</p>
  </section>

  <footer>
    <div class="studio">Hamouni Studio</div>
    <div>ayoubhamouni.contact@gmail.com &middot; 06 59 08 53 55</div>
    <div style="margin-top:6px;"><a href="https://www.instagram.com/hamouni.ay" target="_blank" rel="noopener">@hamouni.ay</a></div>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose">&times;</button>
    <button class="lightbox-prev" id="lbPrev">&#8249;</button>
    <img id="lbImg" src="" alt="">
    <button class="lightbox-next" id="lbNext">&#8250;</button>
    <div class="lightbox-count" id="lbCount"></div>
  </div>

<script>

  const PHOTO_IDS = ["158ogpH9j6JNLSkpkb2QjhSfOUf5BRjVl", "1tuUEuwen6Jk7a_zRVi_5SH1TNR3Pf32C", "1Pyd5t21G1z-m-21G7dkmayzm4UVZRz5i", "1WZmkc4eRv4z7UxV18PqxLcrgacWv5fB6", "1s00EoyJXZtu3ofOMl7mysi2NmAx6UmOQ", "1G9v1hG6Vv7B5Cka6K2btqDUflQl4b426", "1smt0IESbvM72Yn6oIBc42lwMCXOHyrtw", "1fuat_QMUTq-nkwPrJYxAdkjFabaWAnvp", "1oOUzVS8kldjr6BAtvGvrENGdM8pm2nvC", "1JfdkCagwRnuM5pE0qd4wBo7yiIH0pk5S", "1xkLb_GAo6sA7ixglnC1OikxsKbllJDHe", "1X3XgbViz-GyC2h-8LOXecqXi_9djuUMl", "1b-A8p4KUQb7tatGnMeNkW6P2ydlS6VkL", "1jqs60TszZiOJhnH4V9adZ41_MSAS_6oX", "1oJa8VjhEg2YzUxa2FfQvVhX3UwUYcGH3", "1GHeJjlPGPtMcBdCeTCeeTaaPkwUqczKE", "1c1jeOUkwKB7g-FfPD5ApPt-KAwUek9tf", "1naH6waMcfY63HdyoU_VFJB0juwfhC1Lv", "1SqZHKcItBhOmTAjpPU2Aq2ozZ1aXEodp", "1AAkPlaA54bbGgQ4id6ZlkNCV0sSpdDFi", "1MQbkzhKI75TsahwvfJ1dbV6LbLsWPFQ9", "1IfNJiTjSE0AOWiXuHYZVmX7XZuENuvD4", "1ndMUOcBDC4KeYq2grnMs2_fGzwYrRGsz", "1Ctoh3jAm07isyCgOC6J19DN0nmGWQrlu", "1HeCydjsgzlmtdzjBRtGIExP76ZwTNItc", "1srmndQFdSbDwPCiKIzJ9wyqhipVzAPNQ", "18kDr-QPAR3LxjN9s6PpCV5XBvq67th1Z", "1JuADwmEjt1wKmo0lmczeiqdAEl67WqT-", "1rjlNFolNr8XPOm_7A1k8vnA4cKBfYnpl", "1018afqf509nH3BGvx71N78-ALzmNEIZ3", "1Qz5R6HzAxY2KYGa4-s_cQYkic_o_qSkM", "1FYc2c1vx0g2fu9b2R_V6DRupHKB8ongj", "1sfoG2W0C4AAnLfBggYX_rN7x0W-Ea4Zs", "1D-GpZG6NV0R_HTcb6UMkCBFQpg2qYynQ", "1PeAXPtolvlsGc8Nm8j8Yi3wopHY7Ky9p", "1rwqB9TMF2II0iL5zELxdmNp-Xb2oWX86", "1mkBRA7zl_56Urm_Au8hOGozQiarCdAFk", "1JR9bP9c2emF_dZ8nLWtm3VyYaOu3fjQG", "1CXOmomsjy51SvgCaxLcG81ekZjIvScCw", "1u2W4FgD4KBf-3gr4NSYjBojIjYyWjxU7", "1vX4ii-2NSaKfE13OADpt6OCU4mJXVZ6R", "1hG6jx_GDM2i0sMnXi3Z5OTonVhqbJrWW", "1G-ul9fjTbISGqHe9zUe-MaP9c3cYUnV3", "1SmiKqZRL0wlPmwODvBdpFcwQVSP0Si82", "1wexENUWApNNlWyjBEaqOLhZHIinapXQ4", "1jMmQ-bsZYfrF-PvfwC5ieRqsiQY-JLXa", "19vDySad1Wtug58D4N9w-dLC9IKTkDbYP", "1aqgjUe2_VTqbSixPo1M0sAXr2wBYkqAg", "1CpwPaCX-zhSxIecIt7bA1gr-LXtm688z", "17-XEt-9mXV7J5EJxzac12Q2BDfZQQLc-", "18_MIWrE1iOHr0pD1020UrzMJDgP1OWDd", "1-GhZWzYhs2nSelyACUqpeW3ZPUvd_edD", "1hZNsimjTpgPnuzDCwbpT6mx_yaV1tKmz", "1moQaabuHuExhP260   const thumbUrl = (id, size) => `https://drive.google.com/thumbnail?id=${id}&sz=w${size}`;

  /* Gallery build */
  const gallery = document.getElementById('gallery');
  const frag = document.createDocumentFragment();
  PHOTO_IDS.forEach((id, i) => {
    const fig = document.createElement('figure');
    fig.dataset.index = i;
    fig.classList.add('reveal');
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = thumbUrl(id, 500);
    img.alt = 'Photo ' + (i+1);
    img.addEventListener('load', () => img.classList.add('loaded'));
    fig.appendChild(img);
    fig.addEventListener('click', () => openLightbox(i));
    frag.appendChild(fig);
  });
  gallery.appendChild(frag);

  /* Reveal-on-scroll */
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  revealEls.forEach(el => io.observe(el));

  /* Video click-to-play */
  const videoFrame = document.getElementById('videoFrame');
  const playBtn = document.getElementById('playBtn');
  function launchVideo(){
    const iframe = document.createElement('iframe');
    iframe.src = `https://drive.google.com/file/d/${VIDEO_ID}/preview?autoplay=1`;
    iframe.allow = 'autoplay; fullscreen';
    iframe.allowFullscreen = true;
    videoFrame.appendChild(iframe);
    videoFrame.classList.add('playing');
  }
  playBtn.addEventListener('click', (e) => { e.stopPropagation(); launchVideo(); });
  videoFrame.addEventListener('click', () => { if (!videoFrame.classList.contains('playing')) launchVideo(); });

  /* Lightbox */
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCount = document.getElementById('lbCount');
  let current = 0;

  function openLightbox(i){
    current = i;
    updateLightbox();
    lightbox.classList.add('open');
  }
  function updateLightbox(){
    lbImg.classList.remove('shown');
    const img = new Image();
    img.onload = () => { lbImg.src = img.src; requestAnimationFrame(() => lbImg.classList.add('shown')); };
    img.src = thumbUrl(PHOTO_IDS[current], 1600);
    lbCount.textContent = (current+1) + ' / ' + PHOTO_IDS.length;
  }
  function closeLightbox(){ lightbox.classList.remove('open'); }
  function next(){ current = (current+1) % PHOTO_IDS.length; updateLightbox(); }
  function prev(){ current = (current-1+PHOTO_IDS.length) % PHOTO_IDS.length; updateLightbox(); }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', next);
  document.getElementById('lbPrev').addEventListener('click', prev);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });
</script>

</body>
</html>
